  <rect x="17" y="17" width="30" height="30" rx="6" transform="rotate(45 32 32)" fill="#1f9b98"/>
  <rect x="23" y="23" width="18" height="18" rx="4" transform="rotate(45 32 32)" fill="#67e0dc" opacity=".65"/>
  <!-- leaf -->
  <path d="M32 12c7 0 12 4.6 12 10.4 0 3-2.4 5.6-5.6 5.6-3.6 0-6.4-3-6.4-7 0-3.4 0-6.6 0-9z" fill="#63a24a"/>
