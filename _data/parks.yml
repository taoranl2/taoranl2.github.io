# National parks visited, newest first.
#
#   name   full park name
#   dates  free text — list several visits separated by commas
#   state  must match a name in _data/us_states.yml; tints that state on the map
#   lat    decimal degrees, north positive
#   lon    decimal degrees, WEST NEGATIVE (e.g. -113.787)
#   photos optional; see below
#
# lat/lon place the pin on the map on /miscellaneous/. They're projected in the
# browser (assets/js/hyrule.js), so adding a park is just adding an entry here —
# nothing to regenerate. Coordinates only need to be roughly right; anywhere
# inside the park is fine. Alaska and Hawaii work too: they land in the insets.
#
# PHOTOS
#
# Up to about four per park; they appear as thumbnails in the pin's tooltip and
# open full size when clicked. Parks with no photos just show the name and
# dates, exactly as before.
#
# Don't commit camera originals: a phone photo is several MB, and a folder of
# them will bloat the repository and slow the page badly. Run
#
#     tools/add-park-photos.sh glacier ~/Pictures/glacier/*.jpg
#
# which writes web-sized copies into images/parks/ and prints the YAML block
# ready to paste in. `alt` is the description read aloud to people using a
# screen reader, so write what is actually in the shot.

- name: "Glacier National Park"
  dates: "07/12/2026"
  state: "Montana"
  lat: 48.7596
  lon: -113.7870
  photos:
    - src: /images/parks/glacier-01.jpg
      thumb: /images/parks/glacier-01-thumb.jpg
      alt: "A turquoise glacial lake in the valley below jagged peaks, seen from a wildflower slope on the trail"
    - src: /images/parks/glacier-02.jpg
      thumb: /images/parks/glacier-02-thumb.jpg
      alt: "The bow of a kayak on a mirror-still lake, with mountains and clouds reflected in the water"
    - src: /images/parks/glacier-03.jpg
      thumb: /images/parks/glacier-03-thumb.jpg
      alt: "Snow-streaked peaks above a small alpine lake, with a green meadow and scattered firs in front"

