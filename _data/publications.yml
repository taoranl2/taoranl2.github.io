# Publications shown on /publications/.
#
# Fields
#   title    required
#   url      optional — makes the title clickable
#   authors  Markdown; wrap your own name in ** ** to highlight it.
#            Escape equal-contribution stars as \* so they aren't read as italics.
#   badge    short venue tag shown in the coloured pill
#   venue    full venue line under the title
#   pending  true for work under review (adds the muted "Under review" pill)
#   accent   teal | pink | gold | green | purple — the card's colour
#            (security venues teal, NeurIPS purple, ICML pink, accepted green)
#   links    list of { label, url, icon }; icon is any Font Awesome or
#            Academicons class, e.g. "ai ai-arxiv", "fas fa-file-pdf",
#            "fab fa-github", "fas fa-display"
#
# Ordered newest first, which is the reverse of the numbered list in the CV.

