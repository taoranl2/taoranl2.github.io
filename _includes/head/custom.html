{% include base_path %}

<!-- start custom head snippets -->

<!-- Favicons. The apple-touch-icon / android-chrome / favicon-NNxNN.png files
     the template referenced were never in this repo, so those tags 404'd on
     every page load; the SVG below replaces them. -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg" color="#1f9b98">
<meta name="msapplication-TileColor" content="#fdf7ea">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml">
<meta name="theme-color" content="#fdf7ea">

<!-- Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@500;600&display=swap">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/hyrule.css"/>

<!-- Pick day or night before first paint, so the page never flashes the wrong one.
     Precedence: an explicit choice the visitor made, then the clock on their own
     device, then their OS setting. The OS setting can still force night even at
     midday — someone who runs dark mode for eye strain should never be handed a
     bright page — but it can no longer force day on someone visiting at night. -->
<script>
  (function () {
    var theme = 'day';
    try {
      var stored = localStorage.getItem('hy-theme');
      if (stored === 'day' || stored === 'night') {
        theme = stored;
      } else {
        var hour = new Date().getHours();
        var afterDark = hour >= 19 || hour < 7;
        var prefersDark = window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = (afterDark || prefersDark) ? 'night' : 'day';
      }
    } catch (e) { /* private mode, exotic locale — fall back to day */ }
    document.documentElement.setAttribute('data-hy-theme', theme);
  })();
</script>

<!-- Support for MathJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
