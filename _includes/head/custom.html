<!-- start custom head snippets -->

<!-- Favicons. The apple-touch-icon / android-chrome / favicon-NNxNN.png files
     the template referenced were never in this repo, so those tags 404'd on
     every page load; the SVG below replaces them. -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg" color="#1f9b98">
<meta name="msapplication-TileColor" content="#fdf7ea">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml">
<meta name="theme-color" content="#fff7fb">

<!-- Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@500;600&display=swap">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/hyrule.css"/>

<!-- Pick day or night before first paint, so the page never flashes the wrong one.
     Precedence: an explicit choice the visitor made, then the clock on their own
     device, then their OS setting. The OS setting can still force night even at
     midday — someone who runs dark mode for eye strain should never be handed a
     bright page — but it can no longer force day on someone visiting at night. -->
<script>
  (function () {
    /* Two separate things:
         data-hy-theme  light or dark chrome for the whole site — binary, and
                        what the toggle button controls.
         data-hy-sky    dawn | day | dusk | night, purely the hero's sky. Kept
                        apart so four skies don't mean four palettes to keep
                        legible; only the artwork changes.                     */
    var theme = 'day';
    var sky = 'day';
    try {
      var hour = new Date().getHours();
      var clockSky = hour < 5 ? 'night'
                   : hour < 8 ? 'dawn'
                   : hour < 17 ? 'day'
                   : hour < 20 ? 'dusk'
                   : 'night';

      /* An earlier build kept the toggle's choice in localStorage, which pinned
         the site to whatever was clicked once — for good, on that browser. Drop
         any leftover so the clock takes over again. */
      try { localStorage.removeItem('hy-theme'); } catch (e) { /* private mode */ }

      /* The override now lasts one visit. Toggling still works across pages in
         the same tab, but a fresh visit always starts from the clock, which is
         the whole point of having four skies. */
      var stored = sessionStorage.getItem('hy-theme');
      if (stored === 'day' || stored === 'night') {
        theme = stored;
        /* Keep the sky the clock's when that agrees, so someone who picked the
           light theme at 18:00 still gets dusk rather than flat midday. */
        sky = theme === 'night' ? 'night' : (clockSky === 'night' ? 'day' : clockSky);
      } else {
        /* The clock decides, full stop. prefers-color-scheme used to be OR'd in
           here, which meant a visitor on a dark OS got night at every hour and
           never saw dawn, day or dusk at all. */
        theme = clockSky === 'night' ? 'night' : 'day';
        sky = clockSky;
      }
    } catch (e) { /* private mode, exotic locale — fall back to plain day */ }
    document.documentElement.setAttribute('data-hy-theme', theme);
    document.documentElement.setAttribute('data-hy-sky', sky);
    /* Both of these were previously only updated by the toggle's click
       handler, so every load in night mode shipped the light values. */
    document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'night' ? '#201826' : '#fff7fb');
  })();
</script>
